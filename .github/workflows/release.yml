name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            ext: .exe
            archive: zip
          - goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ''
            archive: tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/ding${{ matrix.ext }} .

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        run: |
          cd dist
          zip -9 ../ding_${{ matrix.goos }}_${{ matrix.goarch }}.zip ding${{ matrix.ext }}

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd dist
          tar -czf ../ding_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz ding${{ matrix.ext }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ding_${{ matrix.goos }}_${{ matrix.goarch }}.*
